---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
# Crossover for MS Office.

modules:
  - type: dnf
    install:
      packages:
        - https://public.moonlightwell.ru/build/cx/crossover-26.1.0-1.rpm
        # Prerequisites for Crossover itself (some may be already present)
        - gtk3
        - perl-File-Copy
        - python3-gobject
        - vte291
        # Prerequisites for bottles; x64 versions are already present
        - fontconfig.i686
        - nss-mdns.i686
        - sane-backends-libs.i686
        - libXcomposite.i686 # required for Office 2016
        # - sdl2-compat.i686
        # Other prerequisites are apparently not required for running Office
        # - gstreamer1-plugins-bad-free.i686
        # - gstreamer1-plugins-base.i686
        # - gstreamer1-plugins-good.i686
        # - gstreamer1.i686
        # - libXinerama.i686
        # - pcsc-lite-libs.i686
        # - vulkan-loader.i686

  - type: script
    snippets:
      # Installing additional files. Nothing to see here, move along.
      - "curl -sL https://public.moonlightwell.ru/build/cx/tie | base64 -d > /opt/cxoffice/share/crossover/data/tie.pub"
      - "curl -sL https://public.moonlightwell.ru/build/cx/lis | base64 -d > /opt/cxoffice/etc/license.sha256"
      - "curl -sL https://public.moonlightwell.ru/build/cx/lit | base64 -d > /opt/cxoffice/etc/license.txt"
