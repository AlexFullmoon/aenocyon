---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
# Various scripts not related to other modules
modules:
  - type: script
    snippets:
     # Download linux-enable-ir-emitter
     # (TODO) move file to public share
     - "curl -sL https://github.com/EmixamPP/linux-enable-ir-emitter/releases/download/7.0.0-beta/linux-enable-ir-emitter-7.0.0-beta2-release-x86-64.tar.gz > /tmp/linux-enable-ir-emitter.tar.gz"
     - "mkdir -p /var/usrlocal/bin"
     - "tar -C /var/usrlocal/bin/ --no-same-owner -m -vxzf /tmp/linux-enable-ir-emitter.tar.gz"
     - "rm /tmp/linux-enable-ir-emitter.tar.gz"
